<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>claculator</title>

    <link rel='stylesheet' href='main.css'>
    <style>

     #calculator
     {
        background-color: white;
        width: 90%;
        max-width: 400px;
        padding: 20px;
        margin: 50px auto;
        border: 2px solid black;
        border-radius: 10px;
     }

     #display
     {
        background-color: white;
        width: 80%;
        max-width: 400px;
        padding: 20px;
        margin: 20px;
        border: 2px solid black;
        border-radius: 15px;
     }
     .buttons
     {
        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap: 20px;
     }
     .btn
     {
        text-align: center;
        background-color: white;
        padding: 12px;
        color: black;
        border-radius: 20px;
        font-weight: bold;
        cursor: pointer;

     }
 
    </style>
</head>
<body>
    
    <div  id="calculator">
        <div id="display" >0</div>
        <div class="buttons">

            <button class="btn" onclick="number('7')">7</button>
            <button class="btn" onclick="number('8')">8</button>
            <button class="btn" onclick="number('9')">9</button>
            <button class="btn" onclick="pressOperator('/')">/</button>

            <button class="btn" onclick="number('4')">4</button>
            <button class="btn" onclick="number('5')">5</button>
            <button class="btn" onclick="number('6')">6</button>
            <button class="btn" onclick="pressOperator('*')">*</button>

            <button class="btn" onclick="number('1')">1</button>
            <button class="btn" onclick="number('2')">2</button>
            <button class="btn" onclick="number('3')">3</button>
            <button class="btn" onclick="pressOperator('-')">-</button>

            <button class="btn" onclick="number('0')">0</button>
            <button class="btn" onclick="number('.')">.</button>
            <button class="btn" onclick="pressOperator('%')">%</button>
            <button class="btn" onclick="pressOperator('+')">+</button>

            <button class="btn" onclick="Equal('=')">=</button>
            <button class="btn" onclick="Clear()">C</button>

        </div>
   
    </div>

    <script>

        let display = document.querySelector("#display");
        let current = "0";
        let firstNumber = null;
        let operator = null;

        function number(num)
        {
            if(current === '0')
        {
            current = num;
            display.textContent = current;
        }
            else
        {
            current = current +num;
            display.textContent = current;
        }
        }

        function pressOperator(opr)
        {
            firstNumber = parseFloat(current);
            operator = opr;
            current = "0";
        }

        function Equal()
        {
            let secondNumber = parseFloat(current);
            if (operator === '+') current = String(firstNumber + secondNumber);
            if (operator === '-') current = String(firstNumber - secondNumber);
            if (operator === '*') current = String(firstNumber * secondNumber);
            if (operator === '/') current = String(firstNumber / secondNumber);
            if (operator === '%') current = String(firstNumber % secondNumber);

            operator = null;
            display.textContent =current;
        }

        function Clear()
        {
            current = '0';
            firstNumber = null;
            operator = null;
            display.textContent = current;
        }
   
    </script>

</body>
</html>
